<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger — control de profit de apuestas</title>
<meta name="description" content="Registrá tus apuestas por torneo y mirá cuánto ganás o perdés. Proyecto de portafolio con API serverless y Postgres.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232F66F5'/%3E%3Cpath d='M7 22l6-7 5 4 7-9' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>
  // Aplica el tema guardado antes de pintar para evitar el parpadeo.
  try {
    var saved = localStorage.getItem('ledger:theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main">Saltar al contenido</a>

<header class="topbar">
  <div class="wrap topbar-inner">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M7 22l6-7 5 4 7-9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Ledger</span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" type="button" data-action="toggle-theme" aria-label="Cambiar entre tema claro y oscuro" id="theme-btn"></button>
      <button class="btn btn-primary" type="button" data-action="new-bet" id="new-bet-btn"></button>
    </div>
  </div>
</header>

<main id="main" class="wrap">
  <div id="banner" class="banner" role="alert" hidden></div>

  <div class="filters" role="group" aria-label="Período">
    <div class="chips" id="period-chips"></div>
    <div class="custom-period" id="custom-period" hidden>
      <label for="custom-amount">Últimos</label>
      <input id="custom-amount" type="number" min="1" max="999" inputmode="numeric" value="30">
      <label class="sr-only" for="custom-unit">Unidad</label>
      <select id="custom-unit">
        <option value="days">días</option>
        <option value="weeks">semanas</option>
        <option value="months">meses</option>
      </select>
    </div>
  </div>

  <section class="hero" aria-labelledby="hero-label" id="hero">
    <div class="hero-top">
      <div>
        <p class="hero-label" id="hero-label">Profit</p>
        <p class="hero-number" id="hero-number" aria-live="polite">—</p>
        <p class="hero-sub" id="hero-sub"></p>
      </div>
      <dl class="kpis" id="kpis"></dl>
    </div>
    <div class="chart" id="chart"></div>
  </section>

  <section class="section" aria-labelledby="t-title">
    <div class="section-head">
      <h2 id="t-title">Torneos</h2>
      <button class="btn btn-ghost" type="button" data-action="new-tournament" id="new-t-btn"></button>
    </div>
    <div class="tournaments" id="tournaments"></div>
  </section>

  <section class="section" aria-labelledby="b-title">
    <div class="section-head">
      <h2 id="b-title">Apuestas</h2>
      <div class="toolbar">
        <label class="search">
          <span class="sr-only">Buscar apuestas</span>
          <span class="search-icon" id="search-icon" aria-hidden="true"></span>
          <input id="search" type="search" placeholder="Buscar apuesta o torneo" autocomplete="off">
        </label>
        <button class="btn btn-ghost" type="button" data-action="export" id="export-btn"></button>
      </div>
    </div>
    <div id="bets"></div>
  </section>
</main>

<footer class="wrap footer">
  <p>Proyecto de portafolio con HTML, CSS y JavaScript, funciones serverless en Vercel y Postgres en Neon. Cada visitante trabaja con sus propios datos de demostración.</p>
</footer>

<dialog class="sheet" id="bet-dialog" aria-labelledby="bet-dialog-title"></dialog>
<dialog class="sheet" id="tournament-dialog" aria-labelledby="t-dialog-title"></dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
